<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Hidaya</title>
<meta name="theme-color" content="#0F5132">
<script>
(function(){
  function makeIcon(size){
    const c=document.createElement('canvas'); c.width=size; c.height=size;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#0F5132'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#FFD700'; ctx.beginPath();
    ctx.arc(size/2,size/2,size*0.35,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0F5132'; ctx.font=`bold ${size*0.18}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('AH',size/2,size/2);
    return c.toDataURL();
  }
  const m={
    name:"Al-Hidaya", short_name:"Al-Hidaya",
    start_url:".", display:"standalone",
    background_color:"#0F5132", theme_color:"#0F5132",
    icons:[{src:makeIcon(192),sizes:"192x192",type:"image/png"},{src:makeIcon(512),sizes:"512x512",type:"image/png"}]
  };
  const b=new Blob([JSON.stringify(m)],{type:'application/json'});
  const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(b);
  document.head.appendChild(l);
})();
</script>
<style>
body{margin:0;font-family:system-ui;background:#f5f5f0}
header{background:#0F5132;color:white;padding:20px;text-align:center}
.container{max-width:600px;margin:20px auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
button{background:#0F5132;color:#FFD700;border:0;padding:14px;width:100%;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header><h1>AL-HIDAYA</h1><p>Hanyar Shiga Aljannah</p></header>
<div class="container">
<div class="card"><h2>Salam Ahmad!</h2><p>App dinka yanzu zai yi Install ba tare da icon ba!</p><button onclick="alert('Yanzu danna Share > Add to Home Screen a iPhone')">Sanya App a Waya</button></div>
<div class="card"><h2>Azkar</h2><p>Subhanallah 33x</p><p>Alhamdulillah 33x</p><p>Allahu Akbar 34x</p></div>
</div>
</body>
</html>
