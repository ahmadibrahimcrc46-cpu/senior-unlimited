<script>
// 100% FREE - BABU KEY - LIVE DAGA TURAI!
async function loadRealLive(){
 try{
  const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');
  const data = await res.json();
  const box = document.getElementById('matches');
  let html = "";
  data.events.forEach(ev=>{
   const home = ev.competitions[0].competitors[0].team.displayName;
   const away = ev.competitions[0].competitors[1].team.displayName;
   const hs = ev.competitions[0].competitors[0].score || "0";
   const as = ev.competitions[0].competitors[1].score || "0";
   const status = ev.status.type.detail; // 78', HT, FT
   html += `<div class="card"><div class="card-top"><span>Premier League</span><span class="live">${status}</span></div><div class="card-main"><div class="team">${home}</div><div class="score">${hs}-${as}</div><div class="team" style="text-align:right">${away}</div></div></div>`;
  });
  if(html=="") html="<div style='padding:20px;text-align:center'>Babu wasa yanzu - zai dawo idan Premier League ta fara</div>";
  box.innerHTML=html;
 }catch(e){
  document.getElementById('matches').innerHTML="Ana jawo LIVE...";
 }
}
loadRealLive();
setInterval(loadRealLive, 30000);
</script>
