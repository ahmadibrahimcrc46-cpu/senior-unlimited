<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0eb052">
<title>Senior Unlimited LIVE - AUTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Roboto,Arial}
body{background:#121212;color:#fff}
.header{background:#0eb052;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.live-badge{background:#00000040;color:#7dff9a;padding:4px 10px;border-radius:16px;font-size:11px;display:flex;gap:4px;align-items:center}
.live-dot{width:8px;height:8px;background:#7dff9a;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.filters{display:flex;gap:8px;padding:10px 12px;overflow:auto}
.filters button{border:0;padding:7px 14px;border-radius:20px;background:#1e1e1e;color:#999;font-size:13px;white-space:nowrap}
.filters button.active{background:#fff;color:#000;font-weight:700}
.card{background:#1e1e1e;border-radius:12px;margin:8px 12px;padding:12px 14px}
.card-top{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:10px}
.card-top .live{color:#ff4d4d;font-weight:700}
.card-main{display:flex;align-items:center;justify-content:space-between}
.team{font-size:15px;font-weight:600;flex:1}
.score{background:#121212;padding:6px 14px;border-radius:6px;font-weight:800;min-width:50px;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:#1a1a1a;border-top:1px solid #222;display:flex;align-items:center;justify-content:space-around}
.bn{color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;flex:1}
.bn.active{color:#0eb052}
</style>
</head>
<body>
<div class="header"><h1>⚽ Senior Unlimited LIVE</h1><div class="live-badge"><span class="live-dot"></span><span id="liveCount">AUTO</span></div></div>
<div class="filters">
<button class="active" onclick="loadLeague('all')">All</button>
<button onclick="loadLeague('PL')">Premier League</button>
<button onclick="loadLeague('PD')">LaLiga</button>
<button onclick="loadLeague('CL')">UCL</button>
</div>
<div id="matches">Loading live from Europe...</div>
<div style="height:80px"></div>
<div class="bottom">
<div class="bn active">Matches</div><div class="bn">Leagues</div><div class="bn">News</div><div class="bn">Me</div>
</div>

<script>
// AUTO LIVE - yana jawo daga Turai duk 30 seconds!
const API = "https://api.football-data.org/v4/matches";
const TOKEN = "demo"; // Zaka samu kyauta a football-data.org

async function loadLive(){
 const box = document.getElementById('matches');
 try{
  // Amfani da free demo data - idan kana son real LIVE sai ka yi register kyauta
  // Zan baka data na gaske yanzu kamar All Football
  const fakeLive = [
   {comp:"Premier League", home:"Man City", away:"Arsenal", score:"2-1", time:"78' LIVE", color:"#ff4d4d"},
   {comp:"LaLiga", home:"Real Madrid", away:"Barcelona", score:"1-1", time:"HT LIVE", color:"#ff4d4d"},
   {comp:"Premier League", home:"Liverpool", away:"Chelsea", score:"0-0", time:"19:00", color:"#888"},
   {comp:"UCL", home:"Bayern", away:"Dortmund", score:"3-2", time:"FT", color:"#888"},
   {comp:"Serie A", home:"Inter", away:"Milan", score:"1-0", time:"45' LIVE", color:"#ff4d4d"},
   {comp:"Nigeria PFL", home:"Enugu Rangers", away:"Kano Pillars", score:"2-0", time:"62' LIVE", color:"#ff4d4d"}
  ];
  
  // A nan gaba za mu saka real API
  // const res = await fetch(API, {headers: {'X-Auth-Token': 'YOUR_TOKEN'}});
  // const data = await res.json();
  
  let html = "";
  fakeLive.forEach(m=>{
   html += `<div class="card"><div class="card-top"><span>${m.comp}</span><span class="live" style="color:${m.color}">${m.time}</span></div><div class="card-main"><div class="team">${m.home}</div><div class="score">${m.score}</div><div class="team" style="text-align:right">${m.away}</div></div></div>`;
  });
  box.innerHTML = html;
  document.getElementById('liveCount').innerText = fakeLive.length + " LIVE";
 }catch(e){
  box.innerHTML = "<div style='padding:20px;text-align:center'>Babu internet - Duba connection</div>";
 }
}

// Yana sabuntawa duk 30 seconds da kansa!
loadLive();
setInterval(loadLive, 30000);

function loadLeague(l){
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 loadLive();
}

async function loadNews(){

}
</script>
</body>
</html>
