<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senior Unlimited">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/33/33736.png">
<title>Senior Unlimited LIVE - Auto</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f1419;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
.live-dot{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
button:active{transform:scale(0.95)}
</style>
</head>
<body class="pb-[90px]">
<!-- HEADER -->
<div style="background:#0a8a0a" class="p-3 flex justify-between items-center sticky top-0 z-50 pt-[50px]">
<b class="text-[16px]">⚽ Senior Unlimited LIVE</b>
<span style="background:red" class="text-[10px] px-2.5 py-1 rounded-full font-bold live-dot">● LIVE AUTO</span>
</div>

<!-- TABS -->
<div class="p-2.5 flex gap-2 overflow-auto bg-[#0f1419] sticky top-[82px] z-40" id="tabs">
<button onclick="filterGames('all',this)" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">All</button>
<button onclick="filterGames('PL',this)" class="bg-[#232f3e] px-4 py-2 rounded-full text-xs whitespace-nowrap">Premier League</button>
<button onclick="filterGames('LIGA',this)" class="bg-[#232f3e] px-4 py-2 rounded-full text-xs whitespace-nowrap">LaLiga</button>
<button onclick="filterGames('UCL',this)" class="bg-[#232f3e] px-4 py-2 rounded-full text-xs whitespace-nowrap">UCL</button>
</div>

<div class="p-3 flex justify-between items-center">
<b class="text-sm" id="date"></b>
<span class="text-[10px] opacity-50">Auto-update: ON ✅</span>
</div>

<!-- MATCHES -->
<div class="px-3 space-y-3" id="list"></div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-[#1a232e] flex justify-around py-3.5 border-t border-white/10">
<button class="flex flex-col items-center"><span class="text-green-400 text-[12px] font-bold">Matches</span></button>
<button onclick="alert('Leagues - Zuwa nan gaba insha Allah!')" class="flex flex-col items-center opacity-40"><span class="text-[12px]">Leagues</span></button>
<button onclick="alert('News - Zuwa nan gaba!')" class="flex flex-col items-center opacity-40"><span class="text-[12px]">News</span></button>
<button onclick="alert('Senior Unlimited - Ahmad CRC')" class="flex flex-col items-center opacity-40"><span class="text-[12px]">Me</span></button>
</div>

<script>
// Rana
document.getElementById('date').innerText = new Date().toLocaleDateString('ha-NG',{weekday:'long',day:'numeric',month:'short'}) + ' - Live';

// Wasanni
const games=[
{cat:'PL',lg:'Premier League',h:'Man City',a:'Arsenal',hs:2,as:1,time:"78'",live:true},
{cat:'LIGA',lg:'LaLiga',h:'Real Madrid',a:'Barcelona',hs:1,as:1,time:"HT",live:true},
{cat:'PL',lg:'Premier League',h:'Liverpool',a:'Chelsea',hs:0,as:0,time:"19:00",live:false},
{cat:'UCL',lg:'UCL',h:'Bayern Munich',a:'Dortmund',hs:3,as:2,time:"FT",live:false},
{cat:'LIGA',lg:'LaLiga',h:'Atletico',a:'Sevilla',hs:2,as:0,time:"21:00",live:false},
];

function render(arr){
const c=document.getElementById('list');c.innerHTML='';
arr.forEach(g=>{
const d=document.createElement('div');
d.className='bg-[#1a232e] rounded-xl p-3.5 active:bg-[#232f3e]';
d.style.transition='0.15s';
d.onclick=()=>alert(g.h+' '+g.hs+' - '+g.as+' '+g.a+'\n'+g.lg+'\n'+(g.live?'🔴 LIVE: '+g.time:'🕐 '+g.time));
d.innerHTML=`<div class="flex justify-between text-[11px] opacity-50 mb-2.5"><span>${g.lg}</span><span style="color:${g.live?'#ff4444':'#aaa'};font-weight:${g.live?'bold':'normal'}">${g.live?'● '+g.time+' LIVE':g.time}</span></div><div class="flex justify-between items-center"><span class="font-bold text-[14px] w-[35%] truncate">${g.h}</span><span class="bg-[#0f1419] px-4 py-1.5 rounded-lg font-extrabold text-[15px] border border-white/10">${g.hs} - ${g.as}</span><span class="font-bold text-[14px] w-[35%] text-right truncate">${g.a}</span></div>`;
c.appendChild(d);
});
}

function filterGames(cat,btn){
document.querySelectorAll('#tabs button').forEach(b=>b.className='bg-[#232f3e] px-4 py-2 rounded-full text-xs whitespace-nowrap');
btn.className='bg-white text-black px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap';
if(cat==='all')render(games);else render(games.filter(x=>x.cat===cat));
}

render(games);

// ===== AUTO-UPDATE - BA SAI KA SAKE DOWNLOAD BA =====
setTimeout(()=>{ location.reload(true); }, 30000); // Sake loda bayan 30s
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) location.reload(true); }); // Idan ka bude app ya sabunta
</script>
</body>
</html>
