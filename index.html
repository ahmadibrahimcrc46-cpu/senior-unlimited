<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Senior LIVE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0eb052">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/5/56/Real_Madrid_CF.svg">
<title>Senior Unlimited LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Arial}
body{background:#121212;color:#fff;min-height:100vh}
.header{background:#0eb052;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}
.header h1{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.live-badge{background:#00000040;color:#7dff9a;padding:4px 10px;border-radius:16px;font-size:11px;display:flex;align-items:center;gap:4px}
.live-dot{width:8px;height:8px;background:#7dff9a;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.filters{display:flex;gap:8px;padding:10px 12px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:0;padding:7px 14px;border-radius:20px;background:#1e1e1e;color:#999;font-size:13px;white-space:nowrap}
.filters button.active{background:#fff;color:#000;font-weight:700}
.card{background:#1e1e1e;border-radius:12px;margin:8px 12px;padding:12px 14px}
.card-top{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:10px}
.card-top .live{color:#ff4d4d;font-weight:700}
.card-main{display:flex;align-items:center;justify-content:space-between}
.team{font-size:15px;font-weight:600;flex:1}
.score{background:#121212;padding:6px 14px;border-radius:6px;font-weight:800;font-size:15px;min-width:50px;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:#1a1a1a;border-top:1px solid #222;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
.bn{color:#777;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bn.active{color:#0eb052}
.indicator{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:#fff;border-radius:4px}
</style>
</head>
<body>
<div class="header"><h1>⚽ Senior Unlimited LIVE</h1><div class="live-badge"><span class="live-dot"></span>LIVE</div></div>

<div class="filters">
<button class="active">All</button><button>Premier League</button><button>LaLiga</button><button>UCL</button><button>Serie A</button>
</div>

<div class="card"><div class="card-top"><span>Premier League</span><span class="live">78' LIVE</span></div><div class="card-main"><div class="team">Man City</div><div class="score">2-1</div><div class="team" style="text-align:right">Arsenal</div></div></div>

<div class="card"><div class="card-top"><span>LaLiga</span><span class="live">HT LIVE</span></div><div class="card-main"><div class="team">Real Madrid</div><div class="score">1-1</div><div class="team" style="text-align:right">Barcelona</div></div></div>

<div class="card"><div class="card-top"><span>Premier League</span><span>19:00</span></div><div class="card-main"><div class="team">Liverpool</div><div class="score">0-0</div><div class="team" style="text-align:right">Chelsea</div></div></div>

<div class="card"><div class="card-top"><span>UCL</span><span>FT</span></div><div class="card-main"><div class="team">Bayern</div><div class="score">3-2</div><div class="team" style="text-align:right">Dortmund</div></div></div>

<div style="height:80px"></div>
<div class="bottom">
<div class="bn active"><span>◍</span>Matches</div><div class="bn">Leagues</div><div class="bn">News</div><div class="bn">Me</div>
<div class="indicator"></div>
</div>
</body>
</html>
